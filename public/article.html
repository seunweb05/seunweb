<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article | Seun Web News</title>
    <style>
      :root {
        --bg: #07131f;
        --bg-soft: #0d1f2d;
        --panel: #122534;
        --panel-strong: #18334a;
        --text: #eef6ff;
        --muted: #b5c8d8;
        --line: rgba(255, 255, 255, 0.1);
        --primary: #74baff;
        --accent: #f2c66d;
        --shadow: 0 22px 54px rgba(4, 10, 15, 0.42);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at top left, rgba(116, 186, 255, 0.12), transparent 28%), linear-gradient(180deg, var(--bg) 0%, #0b1b29 100%);
        color: var(--text);
        font: 1rem/1.7 "Segoe UI", Arial, sans-serif;
      }

      a { color: inherit; text-decoration: none; }
      img { max-width: 100%; display: block; }
      main {
        width: min(940px, calc(100% - 32px));
        margin: 0 auto;
        padding: 60px 0 88px;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 28px;
      }
      .article-shell {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 26px;
        padding: 28px 22px 30px;
        box-shadow: var(--shadow);
      }
      .category { color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      .source {
        display: inline-block;
        margin-top: 10px;
        color: var(--primary);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 { font-size: clamp(2.3rem, 6vw, 4.6rem); line-height: 1.04; letter-spacing: -.06em; margin: 16px 0 18px; }
      .meta { color: var(--muted); font-size: 0.95rem; }
      .summary { color: #dfeaf6; font-size: 1.08rem; margin: 18px 0 0; }
      .article-image { width: 100%; max-height: 440px; object-fit: cover; border-radius: 18px; margin: 28px 0; border: 1px solid var(--line); }
      .content { margin-top: 30px; white-space: pre-wrap; color: #dfeaf6; }
      .content p { margin: 0 0 1.2em; }
      @media (max-width: 640px) {
        .article-shell { padding: 22px 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="index.html#latest-news">← Back to Latest News</a>
      <article id="article" class="article-shell"><p>Loading article...</p></article>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
      firebase.initializeApp({
        apiKey: 'AIzaSyAyCqg3RMxA2KRXg-YtuVn1CFePbfHn5sc',
        authDomain: 'seunnewsite2026.firebaseapp.com',
        projectId: 'seunnewsite2026',
        storageBucket: 'seunnewsite2026.firebasestorage.app',
        messagingSenderId: '674678776858'
      });

      const article = document.getElementById('article');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const externalUrl = params.get('url');
      const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[character]));

      if (externalUrl && !externalUrl.includes('article.html')) {
        window.location.replace(externalUrl);
      }

      const renderArticle = (post) => {
        const date = post.createdAt && typeof post.createdAt.toDate === 'function'
          ? post.createdAt.toDate().toLocaleDateString()
          : new Date(post.createdAt || Date.now()).toLocaleDateString();

        const bodyText = post.content || post.summary || '';
        const articleContent = bodyText
          .split(/\n{2,}|\r\n\r\n/)
          .map((paragraph) => paragraph.trim())
          .filter(Boolean)
          .map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`)
          .join('');

        article.innerHTML = `
          <span class="category">${escapeHtml(post.category || 'News')}</span>
          <span class="source">${escapeHtml(post.source || 'Seun Web News')}</span>
          <h1>${escapeHtml(post.title)}</h1>
          <p class="meta">${escapeHtml(post.author || 'Seun Web News')} · ${escapeHtml(date)}</p>
          <p class="summary">${escapeHtml(post.summary)}</p>
          ${post.imageUrl ? `<img class="article-image" src="${escapeHtml(post.imageUrl)}" alt="${escapeHtml(post.title)}">` : ''}
          <div class="content">${articleContent || `<p>${escapeHtml(post.summary)}</p>`}</div>
        `;
      };

      if (id && id.startsWith('local-')) {
        try {
          const localPosts = JSON.parse(localStorage.getItem('snh_posts') || '[]');
          const post = localPosts.find((item) => item.id === id && item.status === 'Published');
          if (!post) {
            article.innerHTML = '<h1>Article not found</h1><p class="summary">This story is not available.</p>';
            return;
          }
          renderArticle(post);
        } catch {
          article.innerHTML = '<h1>Article unavailable</h1><p class="summary">Please try again shortly.</p>';
        }
      } else if (!id) {
        article.innerHTML = '<h1>Article not found</h1><p class="summary">No article was selected.</p>';
      } else {
        firebase.firestore().collection('posts').doc(id).get().then((snapshot) => {
          if (!snapshot.exists || snapshot.data().status !== 'Published') {
            article.innerHTML = '<h1>Article not found</h1><p class="summary">This story is not available.</p>';
            return;
          }

          renderArticle(snapshot.data());
        }).catch(() => {
          article.innerHTML = '<h1>Article unavailable</h1><p class="summary">Please try again shortly.</p>';
        });
      }
    </script>
  </body>
</html>
