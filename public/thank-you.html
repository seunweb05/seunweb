<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Seun Web News</title>
    <meta name="description" content="Thank you for contacting Seun Web News." />
    <link rel="stylesheet" href="style.css" />
    <style>
      .thank-you-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 0;
      }
      .thank-you-card {
        width: min(640px, 100%);
        padding: 48px 36px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: var(--panel);
        box-shadow: var(--shadow);
        text-align: center;
      }
      .thank-you-mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #dbeafe, #93c5fd);
        color: #12336d;
        font: 900 1rem "Segoe UI", Arial, sans-serif;
      }
      .thank-you-card h1 { margin: 0 0 16px; font-size: clamp(2.4rem, 6vw, 4.4rem); }
      .thank-you-card p { max-width: 480px; margin: 0 auto 26px; color: var(--muted); }
      @media (max-width: 520px) { .thank-you-card { padding: 36px 22px; } }
    </style>
  </head>
  <body>
    <main class="thank-you-page">
      <section class="thank-you-card">
        <div class="thank-you-mark">SWN</div>
        <div class="kicker">Message received</div>
        <h1>Thank you for reaching out.</h1>
        <p>Your message has been sent to Seun Web News. I will review it and get back to you as soon as possible.</p>
        <a class="btn btn-primary" href="index.html">Back to Seun Web News</a>
      </section>
    </main>
  </body>
</html>
